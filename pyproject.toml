[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[project]
name = "dars-mini-project"
version = "0.1.0"
description = "DARS – Dynamic Adaptive Retention Scoring for AI Agent Memory"
requires-python = ">=3.10"
